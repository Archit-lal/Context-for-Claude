<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periphery</title>
<meta name="description" content="Periphery builds software for what comes after the screen.">
<meta name="theme-color" content="#FBF8F4">
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-runde@latest/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-runde@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-runde@latest/600.css">
<style>
:root{
  --sans:'Open Runde',-apple-system,system-ui,sans-serif;
  --disp:'Open Runde',-apple-system,system-ui,sans-serif;
  --mono:'Open Runde',-apple-system,system-ui,sans-serif;
  --paper:#FBF8F4;--ink:#171412;--mid:#6B625B;--faint:#A39A92;
  --line:#E6DFD6;--bronze:#8F6420;--red:#C9352B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:48rem;margin:0 auto;padding:5.5rem 1.75rem 4rem}
a{color:inherit}
a:focus-visible{outline:2px solid var(--bronze);outline-offset:3px;border-radius:4px}

.mark{display:flex;align-items:center;gap:.5rem;font-family:var(--disp);font-weight:600;font-size:1rem;letter-spacing:-.01em;margin-bottom:5rem}
.mark svg{width:22px;height:22px;flex:none}

h1{font-family:var(--disp);font-weight:600;font-size:clamp(1.9rem,5.6vw,3.1rem);line-height:1.08;letter-spacing:-.035em}

.thesis-link{display:inline-block;margin-top:1.6rem;font-size:.92rem;color:var(--bronze);text-decoration:none;border-bottom:1px solid rgba(143,100,32,.35)}
.thesis-link:hover{border-bottom-color:var(--bronze)}

.slabel{margin-top:3.25rem;font-size:.62rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.earshot{position:relative;margin-top:.9rem;padding:1.5rem 1.7rem}
.e-frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.e-frame path{fill:none;stroke:var(--red);stroke-linecap:round;stroke-linejoin:round}
.e-s1{stroke-width:2.6}
.e-s2{stroke-width:1.6;opacity:.5}
.earshot:hover .e-s1{stroke-width:3.6}
.earshot:hover .e-s2{stroke-width:2.2;opacity:.65}
.e-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.e-name{font-weight:600;font-size:1.2rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.e-name::after{content:'';position:absolute;inset:0;z-index:0}
.e-mark{position:relative;z-index:1;display:inline-flex;padding:4px;margin:-4px;border-radius:5px}
.e-claude{width:19px;height:19px;flex:none}
.e-meta{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem;margin-top:.85rem;font-size:.78rem;color:var(--faint)}
.e-omi-mark,.e-peri-mark{width:14px;height:14px;flex:none;color:var(--mid)}
.e-desc{display:block;margin-top:.2rem;font-size:.95rem;color:var(--mid)}

.by{display:inline-flex;align-items:center;gap:.7rem;margin-top:3.5rem;color:var(--mid);font-size:.95rem;text-decoration:none}
.by img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line);transition:box-shadow .18s ease}
.by b{font-weight:600;color:var(--ink);border-bottom:1px solid transparent;transition:border-color .18s ease}
.by:hover img{box-shadow:0 0 0 1px var(--bronze)}
.by:hover b{border-bottom-color:var(--bronze)}

footer{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.13em;text-transform:uppercase;font-weight:500;color:var(--faint)}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<main>

        <path d="M7.1 19.5C7.3 21.6 6.8 22.7 5.3 22.4"/>

          <path d="M7.1 19.5C7.3 21.6 6.8 22.7 5.3 22.4"/>
          <path d="M16.9 19.5C16.7 21.6 17.2 22.7 18.7 22.4"/>
        </g>
        <ellipse cx="8.5" cy="11.9" rx="1.15" ry="1.8" fill="currentColor"/>

  </div>

  <a class="by" href="https://www.linkedin.com/in/thefuturistsage" target="_blank" rel="noopener noreferrer">
